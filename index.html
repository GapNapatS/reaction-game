<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reaction Time</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#222;color:#fff;-webkit-user-select:none;user-select:none}
#screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-size:26px;margin:0 0 10px}p{font-size:18px;line-height:1.4;margin:6px 0;max-width:420px}
.big{font-size:84px;font-weight:bold;margin:8px 0}
button{font-size:20px;padding:16px 24px;margin:8px;border:0;border-radius:14px;background:#fff;color:#222;font-weight:bold;min-width:250px}
button.sec{background:#555;color:#fff;font-size:16px;padding:12px 18px;min-width:0}
.small{font-size:15px;opacity:.8}
table{border-collapse:collapse;margin:10px 0;font-size:20px;width:100%;max-width:360px}
th,td{padding:5px 8px;border-bottom:1px solid #555;text-align:center}th{font-size:15px;opacity:.9}
tr.sum td{font-weight:bold;border-top:2px solid #aaa}
.empty{opacity:.35}
</style></head><body><div id="screen"></div>
<script>
const TRIALS = 10, MIN_WAIT = 1500, MAX_WAIT = 4500, KEY = "lab10-reaction-v1";
const el = document.getElementById("screen");
let data = load();            // {D:{times:[],early:0}, ND:{times:[],early:0}}
let hand = "", state = "menu", t0 = 0, timer = null, saveOK = true;

function blank(){return {D:{times:[],early:0},ND:{times:[],early:0}}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.D&&d.ND)return d}catch(e){}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));
      if(localStorage.getItem(KEY)===null)saveOK=false}catch(e){saveOK=false}
}
const full = h => data[h].times.length >= TRIALS;
const name = h => h==="D" ? "Dominant" : "Non-dominant";
function stats(a){
  if(!a.length) return {m:"",sd:""};
  const m=a.reduce((x,y)=>x+y,0)/a.length;
  const sd=a.length>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)):"";
  return {m:m.toFixed(0),sd:sd===""?"":sd.toFixed(0)};
}
function bg(c){document.body.style.background=c}
function show(h){el.innerHTML=h}

function menu(){
  state="menu"; bg("#222"); clearTimeout(timer);
  const lab = h => full(h) ? `${name(h)} hand ✓ (redo)` : data[h].times.length ? `${name(h)} hand (continue, ${data[h].times.length}/${TRIALS})` : `${name(h)} hand`;
  show(`<h1>Reaction time</h1>
  <p>Rest your phone flat and use <b>one finger</b> of the hand you choose.</p>
  <p>The screen goes <b style="color:#ff6b6b">RED</b>, then <b style="color:#5cff7a">GREEN</b>. Tap as fast as you can when it turns green. Do not tap early.</p>
  <p>10 taps per hand. Your results save on this phone.</p>
  <button onclick="start('D')">${lab("D")}</button>
  <button onclick="start('ND')">${lab("ND")}</button>
  <button class="sec" onclick="results()">See my data</button>`);
}
function start(h){
  if(full(h) && !confirm(`Redo the ${name(h).toLowerCase()} hand? This erases its 10 numbers.`)) return;
  hand=h; if(full(h)) data[h]={times:[],early:0}; save(); next();
}
function next(){
  state="wait"; bg("#c0392b");
  show(`<h1>${name(hand)} hand</h1><div class="big">${data[hand].times.length+1} / ${TRIALS}</div><p>Wait for green…</p>`);
  clearTimeout(timer);
  timer=setTimeout(go, MIN_WAIT+Math.random()*(MAX_WAIT-MIN_WAIT));
}
function go(){state="go";bg("#27ae60");show(`<div class="big">TAP!</div>`);t0=performance.now()}
function tooEarly(){
  clearTimeout(timer); data[hand].early++; save(); state="early"; bg("#8e44ad");
  show(`<h1>Too early!</h1><p>That one does not count. Early taps so far: ${data[hand].early}</p><p class="small">Tap to try again</p>`);
}
function hit(){
  const rt=Math.round(performance.now()-t0); data[hand].times.push(rt); save();
  if(full(hand)) return results(true);
  state="shown"; bg("#2c3e50");
  show(`<p>Trial ${data[hand].times.length} of ${TRIALS}</p><div class="big">${rt} ms</div><p class="small">Tap for the next one</p>`);
}
function results(justDone){
  state="results"; bg("#222"); clearTimeout(timer);
  const D=data.D, ND=data.ND, sD=stats(D.times), sN=stats(ND.times);
  let rows="";
  for(let i=0;i<TRIALS;i++)
    rows+=`<tr><td>${i+1}</td><td class="${D.times[i]==null?'empty':''}">${D.times[i]??"-"}</td><td class="${ND.times[i]==null?'empty':''}">${ND.times[i]??"-"}</td></tr>`;
  const both=full("D")&&full("ND");
  const todo=!full("D")?"Dominant hand still to do.":!full("ND")?"Non-dominant hand still to do.":"Both hands done. Keep this screen and copy these numbers into your team's Google Sheet.";
  show(`<h1>My data (ms)</h1>
  <table><tr><th>#</th><th>Dominant</th><th>Non-dominant</th></tr>${rows}
  <tr class="sum"><td>Mean</td><td>${sD.m}</td><td>${sN.m}</td></tr>
  <tr><td>SD</td><td>${sD.sd}</td><td>${sN.sd}</td></tr>
  <tr><td>Early</td><td>${D.early}</td><td>${ND.early}</td></tr></table>
  <p>${todo}</p>
  ${saveOK?`<p class="small">Saved on this phone. If you close this page by accident, scan the QR code again on the same phone and your numbers are still here.</p>`:`<p class="small" style="color:#ffb3b3"><b>This browser cannot save.</b> Take a screenshot of this screen now.</p>`}
  <button onclick="menu()">${both?"Back":"Continue"}</button>
  <button class="sec" onclick="copyData()">Copy numbers (for pasting into Sheets)</button>
  <button class="sec" onclick="wipe()">Erase everything and start over</button>`);
}
function copyData(){
  let t="#\tDominant\tNon-dominant\n";
  for(let i=0;i<TRIALS;i++)t+=`${i+1}\t${data.D.times[i]??""}\t${data.ND.times[i]??""}\n`;
  const ok=()=>alert("Copied. Paste into your Google Sheet.");
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){alert("Could not copy. Take a screenshot instead.")}a.remove()};
  (navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(t).then(ok,fb):fb();
}
function wipe(){
  if(confirm("Erase ALL your numbers on this phone? This cannot be undone.")&&confirm("Really erase everything?")){data=blank();save();menu()}
}
function press(e){
  if(e.target.closest("button")) return;
  if(state==="wait"){e.preventDefault();tooEarly()}
  else if(state==="go"){e.preventDefault();hit()}
  else if(state==="early"||state==="shown"){e.preventDefault();next()}
}
document.addEventListener("pointerdown",press);
// resuming after an accidental close: show saved data first if any exists
(data.D.times.length||data.ND.times.length) ? results() : menu();
</script></body></html>
